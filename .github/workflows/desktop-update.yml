name: Desktop update

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'tests/**'
      - 'electron/**'
      - 'electron-builder.config.cjs'
      - 'release.config.json'
      - 'scripts/release-desktop.cjs'
      - '.github/workflows/desktop-update.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-update-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npm test -- --maxWorkers=2
      - run: node --test tests/desktop-update.test.cjs tests/desktop-release.test.cjs
      - run: npx playwright install chromium
      - run: npx playwright test tests/browser/distort-preview-v214.spec.ts tests/browser/transform-v116.spec.ts tests/browser/transform-modes-v116.spec.ts
      - run: npx playwright test tests/browser/reselection-loop-v215.spec.ts tests/browser/brush-blend-v4.spec.ts
      - run: npx playwright test tests/browser/large-blend-performance.spec.ts tests/browser/crisp-ink-v248.spec.ts
      - run: npx playwright test tests/browser/drawing-session-v249.spec.ts --workers=1
      - run: npx playwright test tests/browser/nature-brush-v250.spec.ts --workers=1
      - run: npx playwright test tests/browser/bitmap-brush-v251.spec.ts --workers=1
      - run: node tests/offscreen-drawing-v186.mjs
      - run: node tests/drawing-latency-v187.mjs
      - run: node tests/project-tabs-v199.mjs
      - run: node tests/new-ink-v200.mjs
      - run: node tests/automatic-ink-v201.mjs
      - run: node tests/brush-settings-v202.mjs
      - run: node tests/ink-tip-v203.mjs
      - run: node tests/imported-grain-v204.mjs
      - run: node tests/width-points-v205.mjs
      - run: node tests/width-entry-v206.mjs
      - run: node tests/compact-brush-v207.mjs
      - run: node tests/sharp-graphs-v209.mjs
      - run: node tests/live-brush-v208.mjs
      - run: node tests/stroke-reselection-v212.cjs
      - run: node tests/stroke-selection-v2.cjs
      - run: node tests/continuous-preview-v211.mjs
      - run: node tests/natural-preview-v216.mjs
      - run: node tests/profile-stability-v208.mjs
      - run: node tests/ink-display-quality-v210.mjs
      - run: node tests/high-dpi-ink-v210.mjs
      - run: node tests/projective-reopen-v215.mjs
      - run: node tests/flow-transform-v217.mjs
      - run: node tests/mixed-ink-reopen-v217.mjs
      - run: node tests/native-mix-display-v221.mjs
      - run: node tests/mix-session-v222.mjs
      - run: node tests/mix-transfer-v223.mjs
      - run: node tests/mix-session-v223.mjs
      - run: node tests/mix-buffers-v224.mjs
      - run: node tests/mix-local-pickup-v225.mjs
      - run: node tests/mix-history-v225.mjs
      - run: node tests/paint-cache-v226.mjs
      - run: node tests/paint-history-v226.mjs
      - run: node tests/watercolor-mix-v227.mjs
      - run: node tests/material-mix-v228.mjs
      - uses: actions/checkout@v4
        with:
          ref: v0.5.200
          path: baseline-ink-200
      - name: Reuse dependencies for saved ink compatibility
        run: node -e "require('fs').symlinkSync(require('path').resolve('node_modules'),require('path').resolve('baseline-ink-200/node_modules'),'junction')"
      - run: node tests/ink-legacy-v201.mjs
      - uses: actions/checkout@v4
        with:
          ref: v0.5.178
          path: baseline-mix-178
      - name: Reuse dependencies for the unchanged baseline
        run: node -e "require('fs').symlinkSync(require('path').resolve('node_modules'),require('path').resolve('baseline-mix-178/node_modules'),'junction')"
      - run: node tests/mix-v179-deep.mjs
        env:
          MIX_BASELINE: baseline-mix-178
      - run: node tests/mix-v179-browser.mjs
        env:
          MIX_PHASE: after
      - run: node tests/mix-v179-reference.mjs
      - run: node tests/mix-v179-ui.mjs
      - run: node tests/native-mix-worker-v220.mjs
      - run: node tests/mix-v179-mirror.mjs
      - name: Build Windows installer (retry transient downloads)
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) {
              Write-Host "Installer build failed; retrying in 15 seconds ($attempt/3)."
              Start-Sleep -Seconds 15
            }
          }
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/release-desktop.cjs verify
      - run: node tests/desktop-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-update
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-verification
          path: |
            validation/desktop-*
            validation/mix-v179/**
            validation/mix-v220/**
            validation/mix-v221/**
            validation/mix-v222/**
            validation/mix-v223/**
            validation/mix-v224/**
            validation/mix-v225/**
            validation/mix-v226/**
            validation/mix-v227/**
            validation/mix-v228/**

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: desktop-update
          path: release
      - run: node scripts/release-desktop.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}

