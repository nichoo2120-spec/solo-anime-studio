name: Blend character validation
on:
  pull_request:
    branches: [main]
jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: [changed, existing]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - if: matrix.test == 'changed'
        run: npx playwright test tests/browser/blend-character-v255.spec.ts --reporter=line
      - if: matrix.test == 'existing'
        uses: actions/checkout@v4
        with:
          ref: 53d785a9a04d8a0001a19c3ff2d8bf475d737b87
          path: baseline-blend-254
      - if: matrix.test == 'existing'
        shell: pwsh
        env:
          BLEND_BASELINE_URL: http://127.0.0.1:5195
        run: |
          node -e "require('fs').symlinkSync(require('path').resolve('node_modules'),require('path').resolve('baseline-blend-254/node_modules'),'junction')"
          $vite = (Resolve-Path node_modules/vite/bin/vite.js).Path
          $baseline = Start-Process -PassThru node -ArgumentList @($vite, '--host', '127.0.0.1', '--port', '5195', '--strictPort') -WorkingDirectory baseline-blend-254
          try {
            for ($attempt = 0; $attempt -lt 25; $attempt++) {
              try { Invoke-WebRequest -UseBasicParsing $env:BLEND_BASELINE_URL | Out-Null; break } catch { Start-Sleep -Milliseconds 500 }
            }
            npx playwright test tests/browser/large-blend-v254.spec.ts tests/browser/brush-blend-v4.spec.ts tests/browser/large-blend-performance.spec.ts --reporter=line
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $baseline.Id -ErrorAction SilentlyContinue }
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -b
      - run: npx vitest run --maxWorkers=2
      - run: npm run build
  all-browser:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
        source: [baseline, candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source == 'baseline' && '53d785a9a04d8a0001a19c3ff2d8bf475d737b87' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/6 --grep-invert "full-resolution Blend masks|300 px and 500 px Blend|Full Brush Settings pins" --reporter=line
