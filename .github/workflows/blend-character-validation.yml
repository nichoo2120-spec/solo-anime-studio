name: Blend character validation
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        test: [build, pixels, performance]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - if: matrix.test == 'build'
        run: npx tsc -b
      - if: matrix.test == 'build'
        run: npx vitest run --maxWorkers=2
      - if: matrix.test == 'build'
        run: npm run build
      - if: matrix.test != 'build'
        run: npx playwright install chromium
      - if: matrix.test == 'pixels'
        run: npx playwright test tests/browser/blend-character-v255.spec.ts --grep-invert "300 px and 500 px" --reporter=line
      - if: matrix.test == 'performance'
        run: npx playwright test tests/browser/blend-character-v255.spec.ts --grep "300 px and 500 px" --reporter=line
