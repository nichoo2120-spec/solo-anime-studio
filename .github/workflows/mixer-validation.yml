name: Mixer validation
on:
  push:
    branches: [mixer-contact-v260]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        run: [first, pixels, latency, build, regression, browser1, browser2, browser3, browser4]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - if: matrix.run == 'build'
        run: |
          npx tsc --noEmit
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          npx vitest run --maxWorkers=2
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          npm run build
      - if: matrix.run == 'regression'
        run: npm run test:regression
      - if: matrix.run == 'first'
        run: npx playwright test tests/browser/mixer-first-dabs.spec.ts
      - if: matrix.run == 'pixels'
        run: npx playwright test tests/browser/blend-character-v255.spec.ts --grep-invert responsive
      - if: matrix.run == 'latency'
        run: npx playwright test tests/browser/blend-character-v255.spec.ts --grep responsive
      - if: startsWith(matrix.run,'browser')
        run: npx playwright test --shard=$('${{ matrix.run }}'.Substring(7) + '/4')
