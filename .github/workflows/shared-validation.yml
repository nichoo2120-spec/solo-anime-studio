name: Shared paint mask validation
on: [push]
jobs:
  validate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [build, shape, pixels, perf, browser1, browser2, browser3, browser4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - if: matrix.suite == 'build'
        run: |
          npx tsc -b
          npm test -- --maxWorkers=2
          npm run build
      - if: matrix.suite == 'shape'
        run: npx playwright test tests/browser/shared-blend-v256.spec.ts
      - if: matrix.suite == 'pixels'
        run: npx playwright test tests/browser/blend-character-v255.spec.ts --grep-invert "300 px"
      - if: matrix.suite == 'perf'
        run: npx playwright test tests/browser/blend-character-v255.spec.ts --grep "300 px"
      - if: startsWith(matrix.suite,'browser')
        run: npx playwright test --shard=${{ matrix.suite == 'browser1' && '1' || matrix.suite == 'browser2' && '2' || matrix.suite == 'browser3' && '3' || '4' }}/4
