name: Large blend profiling
on:
  pull_request:
    branches: [main]
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install chromium
      - uses: actions/checkout@v4
        with:
          ref: df2e47cf9e1380ac66a29520e1a4edd291168b3d
          path: baseline-blend-253
      - name: Benchmark and compare saved pixels
        shell: pwsh
        env:
          BLEND_BASELINE_URL: http://127.0.0.1:5195
        run: |
          node -e "require('fs').symlinkSync(require('path').resolve('node_modules'),require('path').resolve('baseline-blend-253/node_modules'),'junction')"
          $vite = (Resolve-Path node_modules/vite/bin/vite.js).Path
          $baseline = Start-Process -PassThru node -ArgumentList @($vite, '--host', '127.0.0.1', '--port', '5195', '--strictPort') -WorkingDirectory baseline-blend-253
          try {
            for ($attempt = 0; $attempt -lt 25; $attempt++) {
              try { Invoke-WebRequest -UseBasicParsing $env:BLEND_BASELINE_URL | Out-Null; break } catch { Start-Sleep -Milliseconds 500 }
            }
            npx playwright test tests/browser/large-blend-v254.spec.ts --reporter=line
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Process -Id $baseline.Id -ErrorAction SilentlyContinue }
