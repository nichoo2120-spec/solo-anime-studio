name: Large Blend profiling
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/blend-profiling.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright test tests/browser/large-blend-v254.spec.ts --workers=1
        env:
          BLEND_BASELINE_ONLY: '1'
